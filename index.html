<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="close-sidebar" id="closeSidebar">×</button>
            </div>

            <div class="project-list">
                <a href="#" class="project-item active" data-filter="Inbox">
                    <span>Inbox</span>
                    <span class="task-count" id="inboxCount">0</span>
                </a>
                <a href="#" class="project-item" data-filter="Work">
                    <span>My work</span>
                    <span class="task-count" id="workCount">0</span>
                </a>
                <a href="#" class="project-item" data-filter="School">
                    <span>Education</span>
                    <span class="task-count" id="schoolCount">0</span>
                </a>
                <a href="#" class="project-item" data-filter="Personal">
                    <span>Personal</span>
                    <span class="task-count" id="personalCount">0</span>
                </a>
            </div>

            <div class="nav-links">
                <button class="nav-item" data-view="completed">Completed</button>
                <button class="nav-item" id="clearAllBtn" style="color: #ef4444;">Clear All Data</button>
            </div>
        </nav>

        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <button class="menu-toggle" id="menuToggle">☰</button>
                    <h1 id="viewTitle">Today</h1>
                </div>
                <span class="task-count-badge" id="headerTaskCount">0 tasks</span>
            </header>

            <section class="stats-section">
                <div class="stat-card">
                    <div class="stat-number" id="totalTasks">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number completed-color" id="completedTasks">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number pending-color" id="pendingTasks">0</div>
                    <div class="stat-label">Pending</div>
                </div>
            </section>

            <section class="controls-section">
                <input type="text" id="searchInput" placeholder="Search tasks..." class="search-input">
                <select id="sortSelect" class="sort-select">
                    <option value="none">Sort: Default</option>
                    <option value="name">Sort: Name</option>
                    <option value="date">Sort: Due Date</option>
                </select>
            </section>

            <div class="tasks-container">
                <div class="date-header">
                    <h2 class="date-title">Today</h2>
                </div>

                <div id="taskList" class="task-list"></div>

                <button class="add-task-btn" id="addTaskBtn">+</button>

                <div class="add-task-form" id="addTaskForm" style="display: none;">
                    <input type="text" id="taskNameInput" placeholder="Task name" class="task-input">
                    <input type="date" id="dueDateInput" class="date-input">
                    <select id="categorySelect" class="category-select">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="School">School</option>
                    </select>
                    <div class="form-actions">
                        <button id="submitTaskBtn" class="submit-btn">Add Task</button>
                        <button id="cancelTaskBtn" class="cancel-btn">Cancel</button>
                    </div>
                </div>
            </div>

            <nav class="bottom-nav">
                <button class="nav-btn active" data-view="today">Today</button>
                <button class="nav-btn" data-view="upcoming">Upcoming</button>
            </nav>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
